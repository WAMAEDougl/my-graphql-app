type Todo {
  id: Int!
  title: String!
  description: String
  completed: Boolean!
}

input CreateTodoInput {
  title: String!
  description: String
}

input UpdateTodoInput {
  id: Int!
  title: String
  description: String
  completed: Boolean
}

type Query {
  todos: [Todo!]!
  todo(id: Int!): Todo!
}

type Mutation {
  createTodo(createTodoInput: CreateTodoInput!): Todo!
  updateTodo(updateTodoInput: UpdateTodoInput!): Todo!
  removeTodo(id: Int!): Boolean!
}